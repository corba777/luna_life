[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-life"
version = "0.1.0"
description = "Same weights, three ways to answer: gpt-6-luna Decisions vs Responses, and Life-grid cells"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artem Zvyagintsev" }]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
stats = ["scipy>=1.11"]

[tool.setuptools]
py-modules = [
  "e1_env",
  "openai_decisions_client",
  "openai_responses_luna",
  "typesafe_client",
  "typesafe_policy",
  "stats",
]

[tool.setuptools.packages.find]
include = ["life_verify*", "constitutional_life*"]
